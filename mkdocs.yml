site_name: JAX Cookbook
site_url: https://docs.mll.bio/jax-cookbook

repo_url: https://github.com/i-m-mll/jax-cookbook
repo_name: i-m-mll/jax-cookbook

theme: 
  name: material
  features:
    - navigation.sections
    - toc.integrate
    - header.autohide

nav:
  - 'index.md'
  - Examples:
    - Filter-combine wrapper: 'examples/filter-combine.ipynb'
    - Tree array operations: 'examples/tree-array-ops.ipynb'
    - Nested vmap: 'examples/vmap-multi.ipynb'
    - Where-functions: 'examples/where-functions.ipynb'

markdown_extensions:
  - pymdownx.snippets:
      check_paths: true
      base_path: ["docs/embeds/"]
  - pymdownx.arithmatex:  # Render LaTeX via MathJax
      generic: true
  - pymdownx.details  # Enables collapsible admonitions
  - attr_list
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences  # Enables syntax highlighting
  - pymdownx.inlinehilite
  - admonition
  - toc:
      toc_depth: 4  # Only show root objects; i.e. no methods, properties...
      permalink: ¤

extra_javascript:
  - _static/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mknotebooks:  # Jupyter notebooks
      preamble: docs/notebook_preamble.py
  - mkdocstrings:
      enable_inventory: true
      custom_templates: docs/_templates
      handlers:
          python:
              options:
                  show_root_toc_entry: true
                  heading_level: 4  # Heading level for the object name
                  show_root_heading: true  # Show the object name
                  show_root_full_path: true  # Show the full path of the object
                  show_bases: true
                  # show_symbol_type_toc: true
                  annotations_path: brief
                  # merge_init_into_class: true
                  # separate_signature: true    # This and `merge_init_into_class` go together
                  show_signature_annotations: true
                  # signature_crossrefs: true  # This doesn't appear to do anything
                  docstring_section_style: table
                  filters: [
                      "!^_",
                      "__init__",
                      "__call__",
                      "model_spec",
                      "dynamics_spec",
                  ]  # Exclude private but not dunder methods
                  inherited_members: ["__call__"]
                  show_source: false
                  members_order: source  # Same member ordering as in source code
                  # all_members: true